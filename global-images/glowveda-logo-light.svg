<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      .wordmark-glow { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; fill: #77B494; }
      .wordmark-veda { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 400; fill: #2B2B26; letter-spacing: 1px; }
      .tagline { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #6B6B62; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="520" height="160" rx="16" fill="#FAF8F4"/>

  <!-- icon: leaf / dewdrop mark -->
  <g transform="translate(20, 20)">
    <path d="M50 6
             C 74 27, 85 48, 85 62
             C 85 84, 70 98, 50 98
             C 30 98, 15 84, 15 62
             C 15 48, 26 27, 50 6 Z"
          fill="#77B494"/>
    <path d="M50 26 C 47 44, 47 68, 50 92" stroke="#FAF8F4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M50 44 L36 55 M50 44 L64 55 M50 66 L38 75 M50 66 L62 75"
          stroke="#FAF8F4" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <circle cx="74" cy="16" r="6.5" fill="#A9D1BC"/>
  </g>

  <!-- wordmark -->
  <text x="122" y="80" class="wordmark-glow">Glow<tspan class="wordmark-veda">Veda</tspan></text>
  <text x="123" y="108" class="tagline">ORGANIC SOAP CRAFTERS</text>
</svg>
